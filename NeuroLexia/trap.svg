<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Mousetrap</title>
  <defs>
    <linearGradient id="trap_wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a055"/>
      <stop offset="100%" stop-color="#8b5a1b"/>
    </linearGradient>
    <linearGradient id="trap_metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aaaaaa"/>
      <stop offset="50%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="256" cy="455" rx="145" ry="16" fill="#1a1a2e" opacity="0.15"/>
  <!-- Wooden base -->
  <rect x="95" y="360" width="322" height="72" rx="10" fill="url(#trap_wood)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Wood grain lines -->
  <line x1="120" y1="368" x2="118" y2="424" stroke="#7a4810" stroke-width="2" opacity="0.5"/>
  <line x1="165" y1="368" x2="162" y2="424" stroke="#7a4810" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="368" x2="218" y2="424" stroke="#7a4810" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="368" x2="298" y2="424" stroke="#7a4810" stroke-width="2" opacity="0.5"/>
  <line x1="360" y1="368" x2="358" y2="424" stroke="#7a4810" stroke-width="2" opacity="0.5"/>
  <!-- Bait platform -->
  <rect x="225" y="340" width="62" height="28" rx="5" fill="#c8852a" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Metal bar spring (U-shape, set position) -->
  <path d="M135,360 L135,240 Q135,185 200,175 Q256,168 256,200 Q256,230 220,240 L220,360" fill="none" stroke="url(#trap_metal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M135,360 L135,240 Q135,185 200,175 Q256,168 256,200 Q256,230 220,240 L220,360" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spring coil at base left -->
  <ellipse cx="135" cy="360" rx="15" ry="10" fill="#bbbbbb" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Spring coil at base right -->
  <ellipse cx="220" cy="360" rx="15" ry="10" fill="#bbbbbb" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Trigger wire -->
  <line x1="256" y1="200" x2="256" y2="345" stroke="url(#trap_metal)" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="256" y2="345" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Cheese bait on platform -->
  <polygon points="256,325 230,348 282,348" fill="#ffdd44" stroke="#1a1a2e" stroke-width="2.5"/>
  <circle cx="248" cy="340" r="4" fill="#cc9900"/>
  <circle cx="264" cy="336" r="3" fill="#cc9900"/>
</svg>
