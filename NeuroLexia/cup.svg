<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Cup</title>
  <defs>
    <linearGradient id="cup_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ee"/>
      <stop offset="100%" stop-color="#1155bb"/>
    </linearGradient>
    <linearGradient id="cup_inside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88bbff"/>
      <stop offset="100%" stop-color="#5599ee"/>
    </linearGradient>
    <linearGradient id="cup_steam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="256" cy="435" rx="110" ry="18" fill="#1a1a2e" opacity="0.15"/>
  <!-- Mug body -->
  <path d="M160,230 L172,420 Q172,440 192,440 L320,440 Q340,440 340,420 L352,230 Z" fill="url(#cup_body)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Inside top rim -->
  <ellipse cx="256" cy="230" rx="96" ry="22" fill="url(#cup_inside)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- White highlight on body -->
  <path d="M175,260 Q185,300 183,380" stroke="white" stroke-width="10" opacity="0.25" stroke-linecap="round" fill="none"/>
  <!-- Handle -->
  <path d="M340,290 Q400,290 400,340 Q400,390 340,385" fill="none" stroke="#1a1a2e" stroke-width="3.5"/>
  <path d="M340,290 Q395,290 395,340 Q395,385 340,385" fill="url(#cup_body)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Bottom band -->
  <rect x="165" y="410" width="182" height="18" rx="4" fill="#0e3d99" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Steam wisps -->
  <path d="M210,200 Q198,175 210,155 Q222,135 210,115" fill="none" stroke="url(#cup_steam)" stroke-width="7" stroke-linecap="round"/>
  <path d="M256,195 Q244,165 256,145 Q268,125 256,105" fill="none" stroke="url(#cup_steam)" stroke-width="7" stroke-linecap="round"/>
  <path d="M302,200 Q314,175 302,155 Q290,135 302,115" fill="none" stroke="url(#cup_steam)" stroke-width="7" stroke-linecap="round"/>
</svg>
