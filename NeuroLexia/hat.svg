<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Wizard Hat</title>
  <defs>
    <linearGradient id="hat_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc2233"/>
      <stop offset="100%" stop-color="#880011"/>
    </linearGradient>
    <linearGradient id="hat_band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8844cc"/>
      <stop offset="100%" stop-color="#5522aa"/>
    </linearGradient>
    <radialGradient id="hat_star" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </radialGradient>
  </defs>
  <!-- Brim shadow -->
  <ellipse cx="256" cy="400" rx="175" ry="25" fill="#550008" opacity="0.4"/>
  <!-- Hat brim -->
  <ellipse cx="256" cy="390" rx="168" ry="30" fill="url(#hat_main)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Hat cone -->
  <path d="M256,80 L148,390 L364,390 Z" fill="url(#hat_main)" stroke="#1a1a2e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Hat highlight (left edge shine) -->
  <path d="M256,90 L176,360" stroke="white" stroke-width="6" opacity="0.2" stroke-linecap="round"/>
  <!-- Band -->
  <rect x="148" y="358" width="216" height="38" rx="4" fill="url(#hat_band)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Band highlight -->
  <rect x="160" y="362" width="190" height="8" rx="3" fill="white" opacity="0.2"/>
  <!-- Star -->
  <g transform="translate(256,270)">
    <polygon points="0,-38 9,-12 37,-12 16,5 24,32 0,17 -24,32 -16,5 -37,-12 -9,-12" fill="url(#hat_star)" stroke="#1a1a2e" stroke-width="3"/>
    <polygon points="0,-20 5,-6 20,-6 8,3 13,18 0,9 -13,18 -8,3 -20,-6 -5,-6" fill="white" opacity="0.35"/>
  </g>
  <!-- Buckle on band -->
  <rect x="238" y="364" width="36" height="26" rx="3" fill="none" stroke="#ffcc00" stroke-width="3"/>
  <rect x="250" y="370" width="12" height="14" rx="2" fill="#ffcc00"/>
</svg>
