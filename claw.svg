<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Claw</title>
  <defs>
    <linearGradient id="claw_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccddee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8899aa"/>
    </linearGradient>
    <linearGradient id="claw_cable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
  </defs>
  <!-- Cable -->
  <rect x="244" y="60" width="24" height="120" rx="10" fill="url(#claw_cable)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Cable ridges -->
  <line x1="248" y1="85" x2="264" y2="85" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="248" y1="100" x2="264" y2="100" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="248" y1="115" x2="264" y2="115" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="248" y1="130" x2="264" y2="130" stroke="#aaaaaa" stroke-width="2"/>
  <line x1="248" y1="145" x2="264" y2="145" stroke="#aaaaaa" stroke-width="2"/>
  <!-- Claw housing top -->
  <ellipse cx="256" cy="192" rx="52" ry="24" fill="url(#claw_metal)" stroke="#1a1a2e" stroke-width="3.5"/>
  <rect x="204" y="180" width="104" height="55" rx="8" fill="url(#claw_metal)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Housing highlight -->
  <rect x="214" y="185" width="84" height="14" rx="4" fill="white" opacity="0.4"/>
  <!-- Housing bottom join -->
  <ellipse cx="256" cy="235" rx="52" ry="16" fill="#aabbcc" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Left claw prong -->
  <path d="M218,235 Q195,280 185,340 Q180,370 195,388 Q210,405 220,390 Q228,375 225,355 L240,235 Z" fill="url(#claw_metal)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Left prong inner -->
  <path d="M224,240 Q206,285 200,335 Q198,355 206,368" fill="none" stroke="white" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
  <!-- Center claw prong -->
  <path d="M238,235 L238,360 Q238,395 256,400 Q274,395 274,360 L274,235 Z" fill="url(#claw_metal)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Center prong highlight -->
  <rect x="244" y="242" width="10" height="110" rx="4" fill="white" opacity="0.35"/>
  <!-- Right claw prong -->
  <path d="M294,235 Q317,280 327,340 Q332,370 317,388 Q302,405 292,390 Q284,375 287,355 L272,235 Z" fill="url(#claw_metal)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Right prong inner -->
  <path d="M288,240 Q306,285 312,335 Q314,355 306,368" fill="none" stroke="white" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
  <!-- Bolt screws on housing -->
  <circle cx="222" cy="205" r="8" fill="#aabbcc" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="218" y1="205" x2="226" y2="205" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="222" y1="201" x2="222" y2="209" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="290" cy="205" r="8" fill="#aabbcc" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="286" y1="205" x2="294" y2="205" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="290" y1="201" x2="290" y2="209" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>
