<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Star</title>
  <defs>
    <radialGradient id="star_fill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </radialGradient>
    <radialGradient id="star_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffee44" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="210" fill="url(#star_glow)"/>
  <!-- Star shape -->
  <polygon points="256,72 292,172 398,172 314,232 344,336 256,276 168,336 198,232 114,172 220,172" fill="url(#star_fill)" stroke="#1a1a2e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Inner highlight -->
  <polygon points="256,100 282,168 348,168 295,210 315,280 256,238 197,280 217,210 164,168 230,168" fill="white" opacity="0.25"/>
  <!-- Shine spot -->
  <ellipse cx="225" cy="185" rx="25" ry="16" fill="white" opacity="0.5" transform="rotate(-15,225,185)"/>
  <!-- Sparkles around -->
  <g stroke="#ffee44" stroke-width="3" stroke-linecap="round">
    <!-- Top left sparkle -->
    <line x1="120" y1="120" x2="120" y2="100"/>
    <line x1="110" y1="110" x2="130" y2="110"/>
    <line x1="113" y1="113" x2="127" y2="127"/>
    <!-- Top right sparkle -->
    <line x1="392" y1="115" x2="392" y2="95"/>
    <line x1="382" y1="105" x2="402" y2="105"/>
    <line x1="385" y1="108" x2="399" y2="122"/>
    <!-- Bottom left sparkle -->
    <line x1="105" y1="365" x2="105" y2="345"/>
    <line x1="95" y1="355" x2="115" y2="355"/>
    <!-- Bottom right sparkle -->
    <line x1="405" y1="370" x2="405" y2="350"/>
    <line x1="395" y1="360" x2="415" y2="360"/>
    <!-- Right small sparkle -->
    <line x1="440" y1="240" x2="440" y2="228"/>
    <line x1="434" y1="234" x2="446" y2="234"/>
  </g>
  <!-- Small sparkle dots -->
  <circle cx="120" cy="120" r="4" fill="#ffee44"/>
  <circle cx="392" cy="115" r="4" fill="#ffee44"/>
  <circle cx="105" cy="365" r="3" fill="#ffee44"/>
  <circle cx="405" cy="370" r="3" fill="#ffee44"/>
  <circle cx="440" cy="240" r="3" fill="#ffee44"/>
</svg>
