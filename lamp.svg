<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cartoon Lamp</title>
  <defs>
    <linearGradient id="lamp_shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <radialGradient id="lamp_glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffee44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp_base" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ddddee"/>
      <stop offset="100%" stop-color="#888899"/>
    </radialGradient>
  </defs>
  <!-- Glow -->
  <ellipse cx="256" cy="300" rx="160" ry="120" fill="url(#lamp_glow)"/>
  <!-- Shadow -->
  <ellipse cx="256" cy="455" rx="75" ry="15" fill="#1a1a2e" opacity="0.15"/>
  <!-- Base -->
  <ellipse cx="256" cy="435" rx="70" ry="20" fill="url(#lamp_base)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Stem bottom -->
  <rect x="242" y="330" width="28" height="108" rx="12" fill="url(#lamp_base)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Stem knob -->
  <ellipse cx="256" cy="330" rx="22" ry="12" fill="url(#lamp_base)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Shade lower rim -->
  <ellipse cx="256" cy="295" rx="100" ry="20" fill="#cc8800" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Shade body -->
  <path d="M156,295 L185,155 L327,155 L356,295 Z" fill="url(#lamp_shade)" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Shade highlight -->
  <path d="M175,285 L196,168" stroke="white" stroke-width="10" opacity="0.25" stroke-linecap="round"/>
  <!-- Shade top rim -->
  <ellipse cx="256" cy="155" rx="72" ry="15" fill="#ffcc44" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Inner light glow from shade bottom -->
  <ellipse cx="256" cy="295" rx="85" ry="16" fill="#fff9c4" opacity="0.6"/>
  <!-- Shade pattern stripes -->
  <line x1="220" y1="155" x2="196" y2="295" stroke="#ffaa00" stroke-width="2.5" opacity="0.4"/>
  <line x1="256" y1="155" x2="256" y2="295" stroke="#ffaa00" stroke-width="2.5" opacity="0.4"/>
  <line x1="292" y1="155" x2="316" y2="295" stroke="#ffaa00" stroke-width="2.5" opacity="0.4"/>
  <!-- Light rays emanating -->
  <line x1="256" y1="295" x2="180" y2="355" stroke="#ffee44" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="256" y1="295" x2="256" y2="370" stroke="#ffee44" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="256" y1="295" x2="332" y2="355" stroke="#ffee44" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
</svg>
